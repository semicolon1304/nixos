[bar]
order = [ "default" ]

    [bar.default]
    center = [ "workspaces" ]
    concave_edge_corners = false
    enabled = true
    end = [ "tray", "clipboard", "battery", "volume", "brightness", "control-center" ]
    margin_edge = 5
    margin_ends = 5
    margin_opposite_edge = 1
    padding = 9
    position = "top"
    reserve_space = true
    shadow = false
    start = [ "clock", "group:g1" ]
    thickness = 30

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 6.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-2",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1024.0
    cy = 1033.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    background_color = "surface_variant"
    background_opacity = 0.88
    background_radius = 12.0
    box_height = 70.0
    box_width = 400.0
    cx = 800.0
    cy = 881.0
    input_opacity = 1.0
    input_radius = 6.0
    output = "eDP-2"
    rotation = 0.0
    show_caps_lock = true
    show_keyboard_layout = true
    show_login_button = true
    show_password_hint = true
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget]
    box_height = 128.0
    box_width = 288.0
    cx = 800.0
    cy = 692.0
    output = "eDP-2"
    rotation = 0.0
    type = "weather"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 352.0
    cx = 800.0
    cy = 484.0
    output = "eDP-2"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1060.0
    cy = 888.0
    output = "eDP-2"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        command = "noctalia msg panel-toggle session"
        glyph = "power"
        variant = "default"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 128.0
    box_width = 288.0
    cx = 800.0
    cy = 692.0
    output = "eDP-2"
    rotation = 0.0
    type = "weather"

    [lockscreen_widgets.widget.lockscreen-widget-clock]
    box_height = 160.0
    box_width = 352.0
    cx = 800.0
    cy = 484.0
    output = "eDP-2"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-power]
    box_height = 0.0
    box_width = 0.0
    cx = 1060.0
    cy = 888.0
    output = "eDP-2"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-power.settings]
        background = true
        command = "noctalia msg panel-toggle session"
        glyph = "power"
        variant = "default"

[nightlight]
enabled = true

[shell]
font = "Source Sans"
font_family = "DejaVu Sans"

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
builtin = "Gruvbox"
mode = "dark"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "zen-browser", "discord", "neovim", "obsidian", "vscode" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/zack/Pictures/Wallpapers/winter_leaf.JPG"

    [wallpaper.last]
    path = "/home/zack/Pictures/Wallpapers/winter_leaf.JPG"

    [wallpaper.monitors.eDP-2]
    path = "/home/zack/Pictures/Wallpapers/winter_leaf.JPG"

[weather]
enabled = true
unit = "imperial"

[widget.battery]
capsule = true
display_mode = "graphic"
show_label = false

[widget.clipboard]
capsule = true

[widget.clock]
capsule = true
format = "{:%H:%M %a, %B %d}"

[widget.control-center]
capsule = true
custom_image = "/nix/store/ib8bwhkg9f498lfzv8sq1fk0gjzqm1i7-noctalia-5.0.0/share/noctalia/assets/images/distros/nixos.svg"
custom_image_colorize = true
icon_color = "primary"

[widget.cpu]
show_label = false

[widget.ram]
show_label = false

[widget.sysmon]
capsule = true
show_label = false

[widget.temp]
show_label = false

[widget.tray]
capsule = true

[widget.volume]
capsule = true
show_label = false

[widget.workspaces]
display = "none"
